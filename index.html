<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Martinie Method</title>
<style>
  :root {
    --bg: #141414;
    --surface: #1e1e1e;
    --surface2: #282828;
    --border: #333;
    --text: #f0f0f0;
    --text-muted: #666;
    --text-dim: #999;
    --green: #4caf78;
    --blue: #5b8fd4;
    --orange: #d4855b;
    --purple: #9b72d4;
    --gray: #6b6b6b;
    --check: #4caf78;
    --rest-bg: #2a2200;
    --rest-text: #c8a84b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
  }

  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* HOME */
  .home-header {
    padding: 56px 20px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .home-header-left h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
  .home-header-left p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .log-btn {
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 6px 12px;
    background: var(--surface);
    border-radius: 8px;
    border: 1px solid var(--border);
    white-space: nowrap;
    margin-bottom: 4px;
  }
  .log-btn:active { background: var(--surface2); }

  .day-list { padding: 16px 20px; flex: 1; }

  .day-card {
    background: var(--surface);
    border-radius: 14px;
    margin-bottom: 12px;
    padding: 16px 18px;
    border-left: 4px solid transparent;
    cursor: pointer;
    transition: background 0.15s;
  }
  .day-card:active { background: var(--surface2); }
  .day-card.up-next { background: var(--surface2); }

  .day-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .day-number { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
  .day-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .day-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .up-next-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; color: #fff; white-space: nowrap; opacity: 0.9; }
  .last-trained { font-size: 11px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
  .last-duration { color: var(--text-dim); }

  /* DAY SCREEN */
  .day-header {
    padding: 52px 20px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 10;
  }
  .back-btn { font-size: 14px; color: var(--accent); cursor: pointer; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .day-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .day-header-meta { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .day-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn-start { flex: 1; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-start:active { opacity: 0.8; }
  .day-content { flex: 1; overflow-y: auto; padding-bottom: 120px; }

  .section-header { padding: 20px 20px 8px; font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }

  /* EXERCISE ROW */
  .exercise-row { padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .exercise-row:last-child { border-bottom: none; }
  .ex-top { display: flex; align-items: flex-start; gap: 12px; }
  .ex-check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; margin-top: 1px;
  }
  .ex-check.checked { background: var(--check); border-color: var(--check); }
  .ex-check.checked::after { content: ''; width: 10px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translateY(-1px); display: block; }
  .ex-info { flex: 1; min-width: 0; }
  .ex-name { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
  .ex-name.checked-text { color: var(--text-muted); text-decoration: line-through; }
  .ex-prescribed { display: flex; align-items: center; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .ex-field { background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; padding: 4px 8px; font-size: 12px; color: var(--text-dim); cursor: pointer; }
  .ex-field:active { background: #333; }
  .ex-note { font-size: 11px; color: var(--text-muted); }
  .ex-last { font-size: 11px; color: var(--text-dim); margin-top: 8px; padding: 7px 10px; background: var(--surface2); border-radius: 8px; border-left: 2px solid var(--accent); line-height: 1.5; }
  .ex-last-label { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; font-weight: 600; letter-spacing: 0.04em; }
  .ex-log-btn { font-size: 11px; color: var(--accent); margin-top: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }

  /* REST */
  .rest-row { padding: 8px 20px; display: flex; align-items: center; gap: 10px; }
  .rest-btn { background: var(--rest-bg); border: 1px solid #3a3000; border-radius: 8px; padding: 6px 12px; font-size: 12px; color: var(--rest-text); cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .rest-btn:active { opacity: 0.7; }
  .rest-label { font-size: 11px; color: var(--text-muted); }

  /* COMPLETE BAR */
  .complete-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; padding: 12px 20px 28px; background: linear-gradient(transparent, var(--bg) 30%); }
  .btn-complete { width: 100%; color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: -0.2px; }
  .btn-complete:active { opacity: 0.85; }

  /* SUMMARY SCREEN */
  .summary-screen { align-items: center; justify-content: center; padding: 40px 20px; }
  .summary-emoji { font-size: 56px; margin-bottom: 20px; }
  .summary-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
  .summary-duration { font-size: 48px; font-weight: 200; letter-spacing: -2px; margin-bottom: 6px; }
  .summary-label { font-size: 13px; color: var(--text-muted); margin-bottom: 40px; }
  .summary-day { font-size: 15px; color: var(--text-dim); margin-bottom: 40px; }
  .btn-done { background: var(--surface2); color: var(--text); border: none; border-radius: 14px; padding: 16px 48px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-done:active { opacity: 0.8; }

  /* LOG SCREEN */
  .log-header { padding: 52px 20px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  .log-header h2 { font-size: 20px; font-weight: 700; }
  .log-content { flex: 1; overflow-y: auto; padding: 16px 20px 40px; }

  .log-day-section { margin-bottom: 24px; }
  .log-day-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; background: var(--surface); border-radius: 10px;
    cursor: pointer; border-left: 3px solid transparent;
  }
  .log-day-header:active { background: var(--surface2); }
  .log-day-title { font-size: 14px; font-weight: 600; }
  .log-day-count { font-size: 11px; color: var(--text-muted); }
  .log-day-chevron { font-size: 12px; color: var(--text-muted); transition: transform 0.2s; }
  .log-day-chevron.open { transform: rotate(90deg); }

  .log-sessions { display: none; margin-top: 8px; }
  .log-sessions.open { display: block; }

  .log-session { background: var(--surface2); border-radius: 10px; margin-bottom: 8px; padding: 12px 14px; }
  .log-session-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .log-session-date { font-size: 13px; font-weight: 600; color: var(--text); }
  .log-session-duration { font-size: 12px; color: var(--text-muted); }

  .log-exercise { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .log-exercise:last-child { border-bottom: none; }
  .log-ex-name { font-size: 12px; font-weight: 500; color: var(--text-dim); }
  .log-ex-detail { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .log-ex-notes { font-size: 11px; color: var(--text-muted); font-style: italic; margin-top: 2px; }

  .log-empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  /* MODALS */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px 44px; width: 100%; max-width: 430px; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .modal-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .modal-field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .modal-field label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .modal-field input, .modal-field textarea { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 16px; color: var(--text); width: 100%; font-family: inherit; }
  .modal-field textarea { font-size: 14px; resize: none; height: 80px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-cancel { flex: 1; background: var(--surface2); color: var(--text-dim); border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-save { flex: 2; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; }

  /* TIMER */
  .timer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
  .timer-overlay.open { display: flex; }
  .timer-display { font-size: 80px; font-weight: 200; letter-spacing: -3px; color: var(--rest-text); font-variant-numeric: tabular-nums; }
  .timer-label { font-size: 13px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .timer-skip { background: var(--surface); border: none; border-radius: 12px; padding: 12px 32px; font-size: 15px; color: var(--text); cursor: pointer; font-weight: 600; }

  /* TOAST */
  .toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.2s; white-space: nowrap; border: 1px solid var(--border); }
  .toast.show { opacity: 1; }

  .twice-badge { display: inline-block; font-size: 9px; font-weight: 700; background: rgba(76,175,120,0.15); color: var(--green); padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: middle; }
</style>
</head>

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = {
  defaults: {},
  dayLogs: {},      // dayId -> [ { date, startTime, endTime, durationMin, exercises:{exId:{sets,reps,weight,notes,timestamp}} } ]
  completions: {},  // dayId -> [ { timestamp, durationMin } ]
  checked: {},      // sessionKey -> { exId: bool }
  workoutActive: false,
  currentDay: null,
  sessionKey: null,
  workoutStartTime: null,
};

function loadState() {
  try { const s = localStorage.getItem('dan_training_v3'); if (s) state = {...state, ...JSON.parse(s)}; } catch(e) {}
}
function saveState() {
  try { localStorage.setItem('dan_training_v3', JSON.stringify(state)); } catch(e) {}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getDefault(ex) {
  const d = state.defaults[ex.id];
  return { sets: d?.sets ?? ex.sets, reps: d?.reps ?? ex.reps, weight: d?.weight ?? ex.weight };
}

function getLastDayLog(dayId) {
  const logs = state.dayLogs[dayId];
  if (!logs || logs.length === 0) return null;
  return logs[logs.length - 1];
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' · ' +
    d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

function formatDuration(minutes) {
  if (!minutes) return '';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0) return `${h}h ${m}m`;
  return `${m} min`;
}

function formatDurationLong(minutes) {
  if (!minutes) return '0:00';
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}`;
  return `${m}:00`;
}

function getUpNextDay() {
  let latestTimestamp = null;
  let latestDayId = null;
  PLAN.forEach(day => {
    const c = state.completions[day.id];
    if (c && c.length > 0) {
      const last = c[c.length - 1].timestamp;
      if (!latestTimestamp || last > latestTimestamp) {
        latestTimestamp = last;
        latestDayId = day.id;
      }
    }
  });
  if (!latestDayId) return 1;
  return (latestDayId % 5) + 1;
}

function nowISO() { return new Date().toISOString(); }
function todayDateStr() { return new Date().toISOString().split('T')[0]; }

function findEx(exId) {
  for (const day of PLAN) for (const section of day.sections) for (const ex of section.exercises) if (ex.id === exId) return ex;
  return null;
}

function getLastCompletion(dayId) {
  const c = state.completions[dayId];
  if (!c || c.length === 0) return null;
  return c[c.length - 1];
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function renderHome() {
  const upNext = getUpNextDay();
  document.getElementById('home-subtitle').textContent = `Day ${upNext} up next`;
  const list = document.getElementById('day-list');
  list.innerHTML = '';

  PLAN.forEach(day => {
    const isUpNext = day.id === upNext;
    const lastComp = getLastCompletion(day.id);

    const card = document.createElement('div');
    card.className = `day-card day-${day.id}${isUpNext ? ' up-next' : ''}`;
    card.style.borderLeftColor = isUpNext ? getCSSColor(day.color) : 'transparent';
    card.onclick = () => openDay(day.id);

    const lastTrainedHtml = lastComp ? `
      <div class="last-trained">
        <span>${formatDate(lastComp.timestamp)}</span>
        ${lastComp.durationMin ? `<span class="last-duration">${formatDuration(lastComp.durationMin)}</span>` : ''}
      </div>` : '';

    card.innerHTML = `
      <div class="day-card-top">
        <div>
          <div class="day-number">Day ${day.id}</div>
          <div class="day-title">${day.title}</div>
          <div class="day-subtitle">${day.subtitle}</div>
        </div>
        ${isUpNext ? `<div class="up-next-badge" style="background:${day.color}">Up Next</div>` : ''}
      </div>
      ${lastTrainedHtml}`;
    list.appendChild(card);
  });
}

function getCSSColor(colorVar) {
  const map = {'var(--green)':'#4caf78','var(--blue)':'#5b8fd4','var(--orange)':'#d4855b','var(--purple)':'#9b72d4','var(--gray)':'#6b6b6b'};
  return map[colorVar] || '#4caf78';
}

// ── DAY SCREEN ────────────────────────────────────────────────────────────────
function openDay(dayId) {
  const day = PLAN.find(d => d.id === dayId);
  state.currentDay = dayId;
  state.workoutActive = false;
  state.workoutStartTime = null;
  state.sessionKey = `${dayId}-${todayDateStr()}-${Date.now()}`;
  state.checked[state.sessionKey] = {};

  document.getElementById('day-screen-title').textContent = day.title;

  const lastComp = getLastCompletion(dayId);
  document.getElementById('day-header-meta').textContent = day.subtitle + (lastComp ? ` · Last: ${formatDate(lastComp.timestamp)}${lastComp.durationMin ? ' · '+formatDuration(lastComp.durationMin) : ''}` : '');

  document.getElementById('day-screen').style.setProperty('--accent', day.color);
  document.getElementById('btn-start-workout').style.background = getCSSColor(day.color);
  document.getElementById('btn-complete').style.display = 'none';
  document.getElementById('btn-complete').style.background = getCSSColor(day.color);
  document.getElementById('btn-start-workout').textContent = 'Start Workout';
  document.getElementById('btn-start-workout').style.opacity = '1';
  document.getElementById('btn-start-workout').disabled = false;
  document.getElementById('edit-save-btn').style.background = getCSSColor(day.color);
  document.getElementById('log-save-btn').style.background = getCSSColor(day.color);

  renderDayContent(day);
  document.getElementById('home').classList.remove('active');
  document.getElementById('day-screen').classList.add('active');
  document.getElementById('day-content').scrollTop = 0;
}

function renderDayContent(day) {
  const container = document.getElementById('day-content');
  container.innerHTML = '';
  const lastDayLog = getLastDayLog(day.id);

  day.sections.forEach(section => {
    const secHeader = document.createElement('div');
    secHeader.className = 'section-header';
    secHeader.textContent = section.name;
    container.appendChild(secHeader);

    section.exercises.forEach(ex => {
      const d = getDefault(ex);
      const checked = state.checked[state.sessionKey]?.[ex.id] || false;
      const lastExLog = lastDayLog?.exercises?.[ex.id] || null;

      const row = document.createElement('div');
      row.className = 'exercise-row';
      row.id = `ex-row-${ex.id}`;

      const parts = [];
      if (d.sets) parts.push(`${d.sets}×`);
      if (d.reps) parts.push(d.reps);
      if (d.weight) parts.push(`· ${d.weight}`);
      const prescribed = parts.join(' ');

      const twiceBadge = ex.twice ? `<span class="twice-badge">2×/wk</span>` : '';

      let lastHtml = '';
      if (lastExLog && (lastExLog.sets || lastExLog.reps || lastExLog.weight || lastExLog.notes)) {
        const p2 = [];
        if (lastExLog.sets) p2.push(`${lastExLog.sets}×`);
        if (lastExLog.reps) p2.push(lastExLog.reps);
        if (lastExLog.weight) p2.push(lastExLog.weight);
        const summary = p2.join(' ');
        const ts = lastExLog.timestamp ? ` · ${formatDateTime(lastExLog.timestamp)}` : (lastDayLog?.date ? ` · ${formatDate(lastDayLog.date)}` : '');
        lastHtml = `
          <div class="ex-last">
            <div class="ex-last-label">Last session${ts}</div>
            ${summary ? `<div>${summary}</div>` : ''}
            ${lastExLog.notes ? `<div style="color:var(--text-muted);margin-top:2px;">${lastExLog.notes}</div>` : ''}
          </div>`;
      }

      const logBtnHtml = state.workoutActive
        ? `<div class="ex-log-btn" onclick="openLogModal('${ex.id}')">+ Log actual</div>`
        : '';

      row.innerHTML = `
        <div class="ex-top">
          <div class="ex-check ${checked ? 'checked' : ''}" onclick="toggleCheck('${ex.id}')"></div>
          <div class="ex-info">
            <div class="ex-name ${checked ? 'checked-text' : ''}">${ex.name}${twiceBadge}</div>
            <div class="ex-prescribed">
              ${prescribed ? `<div class="ex-field" onclick="openEditModal('${ex.id}')">${prescribed}</div>` : `<div style="font-size:11px;color:var(--text-muted);">${d.reps||''}</div>`}
              ${ex.note ? `<div class="ex-note">— ${ex.note}</div>` : ''}
            </div>
            ${lastHtml}
            ${logBtnHtml}
          </div>
        </div>`;
      container.appendChild(row);
    });

    if (section.rest) container.appendChild(makeRestRow(section.rest));
  });
}

function makeRestRow(seconds) {
  const row = document.createElement('div');
  row.className = 'rest-row';
  const label = seconds >= 120 ? '2 min' : seconds === 90 ? '90 sec' : `${seconds} sec`;
  row.innerHTML = `<button class="rest-btn" onclick="startTimer(${seconds})">⏱ ${label}</button><span class="rest-label">Rest</span>`;
  return row;
}

function goHome() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('home').classList.add('active');
  renderHome();
}

// ── WORKOUT MODE ──────────────────────────────────────────────────────────────
function startWorkout() {
  state.workoutActive = true;
  state.workoutStartTime = Date.now();
  document.getElementById('btn-start-workout').textContent = 'In Progress';
  document.getElementById('btn-start-workout').style.opacity = '0.5';
  document.getElementById('btn-start-workout').disabled = true;
  document.getElementById('btn-complete').style.display = 'block';
  const day = PLAN.find(d => d.id === state.currentDay);
  renderDayContent(day);
  showToast('Workout started');
}

function toggleCheck(exId) {
  if (!state.checked[state.sessionKey]) state.checked[state.sessionKey] = {};
  state.checked[state.sessionKey][exId] = !state.checked[state.sessionKey][exId];
  saveState();
  const row = document.getElementById(`ex-row-${exId}`);
  if (!row) return;
  row.querySelector('.ex-check').classList.toggle('checked', state.checked[state.sessionKey][exId]);
  row.querySelector('.ex-name').classList.toggle('checked-text', state.checked[state.sessionKey][exId]);
}

function completeDay() {
  const endTime = Date.now();
  const durationMin = state.workoutStartTime ? Math.round((endTime - state.workoutStartTime) / 60000) : null;
  const ts = new Date().toISOString();

  // save completion
  if (!state.completions[state.currentDay]) state.completions[state.currentDay] = [];
  state.completions[state.currentDay].push({ timestamp: ts, durationMin });

  // ensure dayLog entry exists
  if (!state.dayLogs[state.currentDay]) state.dayLogs[state.currentDay] = [];
  let todayLog = state.dayLogs[state.currentDay].find(l => l.date === todayDateStr());
  if (!todayLog) {
    todayLog = { date: todayDateStr(), startTime: new Date(state.workoutStartTime).toISOString(), endTime: ts, durationMin, exercises: {} };
    state.dayLogs[state.currentDay].push(todayLog);
  } else {
    todayLog.endTime = ts;
    todayLog.durationMin = durationMin;
  }

  // clear checked state for this session
  delete state.checked[state.sessionKey];

  saveState();

  // show summary
  const day = PLAN.find(d => d.id === state.currentDay);
  document.getElementById('summary-duration').textContent = formatDurationLong(durationMin);
  document.getElementById('summary-day').textContent = day.title;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('summary-screen').classList.add('active');
}

// ── EDIT MODAL ────────────────────────────────────────────────────────────────
let editingExId = null;
function openEditModal(exId) {
  editingExId = exId;
  const ex = findEx(exId); const d = getDefault(ex);
  document.getElementById('edit-modal-title').textContent = ex.name;
  document.getElementById('edit-sets').value = d.sets || '';
  document.getElementById('edit-reps').value = d.reps || '';
  document.getElementById('edit-weight').value = d.weight || '';
  document.getElementById('edit-modal').classList.add('open');
}
function closeEditModal() { document.getElementById('edit-modal').classList.remove('open'); editingExId = null; }
function saveEdit() {
  if (!editingExId) return;
  state.defaults[editingExId] = { sets: parseInt(document.getElementById('edit-sets').value)||null, reps: document.getElementById('edit-reps').value, weight: document.getElementById('edit-weight').value };
  saveState(); closeEditModal();
  renderDayContent(PLAN.find(d => d.id === state.currentDay));
  showToast('Default saved');
}

// ── LOG MODAL ─────────────────────────────────────────────────────────────────
let loggingExId = null;
function openLogModal(exId) {
  loggingExId = exId;
  const ex = findEx(exId); const d = getDefault(ex);
  document.getElementById('log-modal-title').textContent = ex.name;
  document.getElementById('log-sets').value = d.sets || '';
  document.getElementById('log-reps').value = d.reps || '';
  document.getElementById('log-weight').value = d.weight || '';
  document.getElementById('log-notes').value = '';
  document.getElementById('log-modal').classList.add('open');
}
function closeLogModal() { document.getElementById('log-modal').classList.remove('open'); loggingExId = null; }
function saveLog() {
  if (!loggingExId) return;
  if (!state.dayLogs[state.currentDay]) state.dayLogs[state.currentDay] = [];
  let todayLog = state.dayLogs[state.currentDay].find(l => l.date === todayDateStr());
  if (!todayLog) {
    todayLog = { date: todayDateStr(), startTime: new Date(state.workoutStartTime||Date.now()).toISOString(), endTime: null, durationMin: null, exercises: {} };
    state.dayLogs[state.currentDay].push(todayLog);
  }
  todayLog.exercises[loggingExId] = {
    sets: document.getElementById('log-sets').value,
    reps: document.getElementById('log-reps').value,
    weight: document.getElementById('log-weight').value,
    notes: document.getElementById('log-notes').value,
    timestamp: new Date().toISOString(),
  };
  saveState(); closeLogModal();
  renderDayContent(PLAN.find(d => d.id === state.currentDay));
  showToast('Logged');
}

// ── MASTER LOG SCREEN ─────────────────────────────────────────────────────────
function openLog() {
  const content = document.getElementById('log-content');
  content.innerHTML = '';

  let hasAny = false;
  PLAN.forEach(day => {
    const logs = state.dayLogs[day.id];
    if (!logs || logs.length === 0) return;
    hasAny = true;

    const section = document.createElement('div');
    section.className = 'log-day-section';

    const sessionsId = `log-sessions-${day.id}`;
    const chevronId = `log-chevron-${day.id}`;

    const header = document.createElement('div');
    header.className = 'log-day-header';
    header.style.borderLeftColor = getCSSColor(day.color);
    header.innerHTML = `
      <div>
        <div class="log-day-title">Day ${day.id} · ${day.title}</div>
        <div class="log-day-count">${logs.length} session${logs.length !== 1 ? 's' : ''}</div>
      </div>
      <div class="log-day-chevron" id="${chevronId}">›</div>`;
    header.onclick = () => {
      const sessions = document.getElementById(sessionsId);
      const chevron = document.getElementById(chevronId);
      sessions.classList.toggle('open');
      chevron.classList.toggle('open');
    };
    section.appendChild(header);

    const sessionsEl = document.createElement('div');
    sessionsEl.className = 'log-sessions';
    sessionsEl.id = sessionsId;

    // most recent first
    [...logs].reverse().forEach(log => {
      const sessionEl = document.createElement('div');
      sessionEl.className = 'log-session';

      const exEntries = Object.entries(log.exercises || {});
      const exHtml = exEntries.length > 0 ? exEntries.map(([exId, data]) => {
        const ex = findEx(exId);
        const name = ex ? ex.name : exId;
        const parts = [];
        if (data.sets) parts.push(`${data.sets}×`);
        if (data.reps) parts.push(data.reps);
        if (data.weight) parts.push(data.weight);
        const tsStr = data.timestamp ? `<span style="color:var(--text-muted);font-size:10px;"> · ${new Date(data.timestamp).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</span>` : '';
        return `<div class="log-exercise">
          <div class="log-ex-name">${name}${tsStr}</div>
          ${parts.length ? `<div class="log-ex-detail">${parts.join(' ')}</div>` : ''}
          ${data.notes ? `<div class="log-ex-notes">${data.notes}</div>` : ''}
        </div>`;
      }).join('') : `<div style="font-size:12px;color:var(--text-muted);padding:4px 0;">No exercises logged</div>`;

      sessionEl.innerHTML = `
        <div class="log-session-header">
          <div class="log-session-date">${formatDateTime(log.startTime || log.date)}</div>
          ${log.durationMin ? `<div class="log-session-duration">${formatDuration(log.durationMin)}</div>` : ''}
        </div>
        ${exHtml}`;
      sessionsEl.appendChild(sessionEl);
    });

    section.appendChild(sessionsEl);
    content.appendChild(section);
  });

  if (!hasAny) {
    content.innerHTML = '<div class="log-empty">No sessions logged yet.<br>Complete a workout to start tracking.</div>';
  }

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('log-screen').classList.add('active');
}

// ── TIMER ─────────────────────────────────────────────────────────────────────
let timerInterval = null, timerRemaining = 0;
function startTimer(seconds) {
  timerRemaining = seconds; updateTimerDisplay();
  document.getElementById('timer-overlay').classList.add('open');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) { clearInterval(timerInterval); skipTimer(); showToast("Rest done — let's go"); }
  }, 1000);
}
function updateTimerDisplay() {
  const m = Math.floor(timerRemaining/60), s = timerRemaining%60;
  document.getElementById('timer-display').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}
function skipTimer() { clearInterval(timerInterval); document.getElementById('timer-overlay').classList.remove('open'); }

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2000);
}

// ── CLOSE MODALS ──────────────────────────────────────────────────────────────
document.getElementById('edit-modal').addEventListener('click', e => { if (e.target===document.getElementById('edit-modal')) closeEditModal(); });
document.getElementById('log-modal').addEventListener('click', e => { if (e.target===document.getElementById('log-modal')) closeLogModal(); });

// ── INIT ──────────────────────────────────────────────────────────────────────
loadState();
renderHome();
</script>
</body>
</html>
